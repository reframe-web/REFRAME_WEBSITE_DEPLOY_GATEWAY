name: Deploy RE:FRAME from Drive

on:
  push:
    branches: [main]
    paths:
      - ".deploy/production-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reframe-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DRIVE_SOURCE_FOLDER_ID: "1zE7ea3LeYMSBhcLcfjit-eFROZksR8Ku"
    steps:
      - name: Check out the Gateway only
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set snapshot directory
        shell: pwsh
        run: |
          "SNAPSHOT_DIR=$env:RUNNER_TEMP\reframe-drive-source" >> $env:GITHUB_ENV

      - name: Fetch a stable Drive snapshot
        id: snapshot
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            if (Test-Path -LiteralPath $env:SNAPSHOT_DIR) {
              Remove-Item -LiteralPath $env:SNAPSHOT_DIR -Recurse -Force
            }

            Write-Output "Drive snapshot attempt $attempt/$maxAttempts"
            node scripts/fetch-drive-source.mjs
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Stable Drive snapshot acquired."
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "Drive snapshot was not stable or could not be fetched. Retrying after 6 seconds."
              Start-Sleep -Seconds 6
            }
          }

          throw "Unable to acquire a stable Drive snapshot after $maxAttempts attempts."

      - name: Build and check the Drive source
        shell: pwsh
        run: |
          $sourceRoot = $env:SNAPSHOT_DIR
          Push-Location -LiteralPath $sourceRoot
          try {
            npm test
            if ($LASTEXITCODE -ne 0) { throw "Source build or KFB authentication checks failed." }
          }
          finally {
            Pop-Location
          }

      - name: Deploy and verify the Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_FINGERPRINT: ${{ steps.snapshot.outputs.source_fingerprint }}
          WORKER_ORIGIN: "https://reframe-web.hungrypriest1224.workers.dev"
          PUBLIC_ORIGIN: "https://reframe-web.org"
        shell: pwsh
        run: ./scripts/deploy-and-verify.ps1

      - name: Remove temporary source snapshot
        if: always()
        shell: pwsh
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          $snapshot = [IO.Path]::GetFullPath($env:SNAPSHOT_DIR)
          if (-not $snapshot.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) { throw "Snapshot path is outside the runner temporary directory." }
          if (Test-Path -LiteralPath $snapshot) { Remove-Item -LiteralPath $snapshot -Recurse -Force }
